<style>
/* Layout: one-screen pothi app. A slim header, then the card deck takes every remaining pixel; filters live in a bottom sheet. */
:root {
  --paper: #e8d4a6; --paper-deep: #d9c08a; --leaf: #f4e7c5;
  --ink: #2a1b10; --ink-soft: #6a5038;
  --kesri: #bf5a12; --neela: #1c2650; --gold: #9c7322; --gold-soft: rgba(156,115,34,.28);
  --hair: rgba(90,60,25,.2);
  --do: #3d6a2f; --do-bg: rgba(61,106,47,.12);
  --dont: #8f2618; --dont-bg: rgba(143,38,24,.1);
  --ideal: #1c2650; --ideal-bg: rgba(28,38,80,.09);
  --vision: #8a5a06; --vision-bg: rgba(156,115,34,.16);
  --warn: #9a4a06; --warn-bg: rgba(191,90,18,.12);
  --shadow: 0 18px 40px -18px rgba(60,35,10,.55), 0 2px 6px rgba(60,35,10,.18);
  --scrim: rgba(28,20,8,.45);
  --bar: #1c2650; --bar-ink: #f2e3bd; --bar-dim: rgba(242,227,189,.55);
  --stage-bg: #1a2147; --stage-glow: rgba(214,150,60,.35); --stage-ink: rgba(240,226,189,.7); --stage-accent: #f2a14e;
  --f-gur: "Noto Serif Gurmukhi", "Mukta Mahee", "Raavi", serif;
  --f-gur-ui: "Mukta Mahee", "Noto Serif Gurmukhi", "Raavi", sans-serif;
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body: "Spectral", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1328; --paper-deep: #0a0d1d; --leaf: #171d38;
  --ink: #f0e2bd; --ink-soft: #bba985;
  --kesri: #f2923e; --neela: #9fb2ee; --gold: #d6aa4e; --gold-soft: rgba(214,170,78,.3);
  --hair: rgba(214,170,78,.2);
  --do: #9bcf86; --do-bg: rgba(155,207,134,.12);
  --dont: #f39a88; --dont-bg: rgba(243,154,136,.12);
  --ideal: #a9bcf5; --ideal-bg: rgba(169,188,245,.12);
  --vision: #e7c072; --vision-bg: rgba(231,192,114,.14);
  --warn: #f7b06a; --warn-bg: rgba(247,176,106,.13);
  --shadow: 0 20px 40px -18px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  --scrim: rgba(0,0,0,.55);
  --bar: #080b18; --bar-ink: #f0e2bd; --bar-dim: rgba(240,226,189,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0f1328; --paper-deep: #0a0d1d; --leaf: #171d38;
  --ink: #f0e2bd; --ink-soft: #bba985;
  --kesri: #f2923e; --neela: #9fb2ee; --gold: #d6aa4e; --gold-soft: rgba(214,170,78,.3);
  --hair: rgba(214,170,78,.2);
  --do: #9bcf86; --do-bg: rgba(155,207,134,.12);
  --dont: #f39a88; --dont-bg: rgba(243,154,136,.12);
  --ideal: #a9bcf5; --ideal-bg: rgba(169,188,245,.12);
  --vision: #e7c072; --vision-bg: rgba(231,192,114,.14);
  --warn: #f7b06a; --warn-bg: rgba(247,176,106,.13);
  --shadow: 0 20px 40px -18px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  --scrim: rgba(0,0,0,.55);
  --bar: #080b18; --bar-ink: #f0e2bd; --bar-dim: rgba(240,226,189,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--paper);
  background-image: radial-gradient(120% 80% at 50% 0%, transparent 40%, var(--paper-deep) 100%);
  color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
#dust { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--kesri); outline-offset: 2px; border-radius: 6px; }
.gur { font-family: var(--f-gur); }

/* ---------- shell ---------- */
.stage, .device { height: 100%; }
.screen { height: 100%; position: relative; container: screen / size; }
.app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; overflow: hidden; overflow: clip; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* header: one row, title on the left, two tools on the right */
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px 16px; min-height: 56px; }
.seal {
  width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #e48a3c, var(--kesri) 60%, #8a3c08);
  color: #fff5df; box-shadow: 0 0 0 1.5px var(--leaf), 0 0 0 2.5px var(--gold);
}
.seal svg { width: 27px; height: 27px; color: var(--neela-ink, #1c2650); }
.brand { flex: 1; min-width: 0; line-height: 1.15; }
.brand .pa { font-family: var(--f-gur); font-weight: 700; font-size: 1.18rem; }
.brand .sub { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: transparent;
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.icon-btn:hover { background: var(--gold-soft); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn .pip { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--kesri); color: #fff8ea; font: 700 .64rem/16px var(--f-body); text-align: center; }

/* search mode replaces the header row */
.searchbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px 16px; min-height: 56px; }
.field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--leaf); border: 1px solid var(--hair); }
.field svg { width: 17px; height: 17px; color: var(--gold); flex: none; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 16px var(--f-body); }
.field input::placeholder { color: var(--ink-soft); opacity: .75; }
.text-btn { border: 0; background: none; color: var(--kesri); font-weight: 600; padding: 8px 4px; cursor: pointer; }

.progress { height: 2px; background: var(--hair); margin: 0 16px; border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--kesri); transition: width .25s; }

/* active filters, only present when something is filtered */
.active { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px 0; }
.active::-webkit-scrollbar { display: none; }
.tag { flex: none; display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 4px 6px 4px 10px; background: var(--neela); color: var(--leaf); font-size: .8rem; cursor: pointer; }
.tag svg { width: 14px; height: 14px; opacity: .8; }
.tag.clear { background: transparent; color: var(--kesri); padding: 4px 8px; font-weight: 600; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag:not(.clear) { color: #0f1328; } }
:root[data-theme="dark"] .tag:not(.clear) { color: #0f1328; }

/* ---------- deck ---------- */
.deck-wrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.deck {
  flex: 1; min-height: 0; display: flex; gap: 12px;
  overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 10px calc(50% - min(41cqw, 200px)) 12px;
  overscroll-behavior-x: contain; position: relative;
}
.deck::-webkit-scrollbar { display: none; }
.slot {
  flex: none; width: min(82cqw, 400px); height: 100%;
  scroll-snap-align: center; scroll-snap-stop: always;
  perspective: 1000px;
}
.card {
  width: 100%; height: 100%;
  position: relative; border-radius: 18px;
  background: radial-gradient(140% 90% at 50% 0%, transparent 55%, var(--gold-soft) 140%), var(--leaf);
  box-shadow: var(--shadow);
  will-change: transform, opacity; backface-visibility: hidden;
}
.card::before { content: ""; position: absolute; inset: 6px; border: 1.25px solid var(--gold); border-radius: 13px; pointer-events: none; }
.corner { position: absolute; width: 24px; height: 24px; color: var(--gold); z-index: 2; pointer-events: none; }
.corner.tl { top: 2px; left: 2px; } .corner.tr { top: 2px; right: 2px; transform: scaleX(-1); }
.corner.bl { bottom: 2px; left: 2px; transform: scaleY(-1); } .corner.br { bottom: 2px; right: 2px; transform: scale(-1,-1); }

.leaf-scroll {
  position: absolute; inset: 8px; overflow-y: auto; overscroll-behavior: contain; border-radius: 11px;
  padding: 18px 16px 34px; scrollbar-width: none;
  display: flex; flex-direction: column; gap: 18px;
}
.leaf-scroll::-webkit-scrollbar { display: none; }
.scroll-hint { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 56px; border-radius: 0 0 11px 11px; pointer-events: none; z-index: 1;
  background: linear-gradient(transparent, var(--leaf) 80%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; transition: opacity .3s; }
.scroll-hint svg { width: 18px; height: 18px; color: var(--gold); animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(3px); } }
.card.at-end .scroll-hint { opacity: 0; }

/* card head: icon, number + theme, then type */
.card-head { display: grid; justify-items: center; gap: 8px; text-align: center; }
.medal { position: relative; width: 76px; height: 76px; }
.medal .ring { position: absolute; inset: 0; color: var(--gold); }
.card.is-active .medal .ring { animation: spin 60s linear infinite; }
.medal .disc { position: absolute; inset: 10px; border-radius: 50%; display: grid; place-items: center; color: #fff4dc;
  background: radial-gradient(circle at 34% 28%, #ee9a4c, var(--kesri) 55%, #7d3606);
  box-shadow: inset 0 -4px 10px rgba(80,30,0,.35), inset 0 3px 6px rgba(255,220,170,.35); }
.medal .disc svg { width: 32px; height: 32px; }
@keyframes spin { to { transform: rotate(360deg); } }
.meta { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 8px; font-size: .82rem; color: var(--ink-soft); }
.meta .num { font-family: var(--f-gur); font-weight: 700; font-size: 1.05rem; color: var(--kesri); }
.meta .th { font-family: var(--f-display); font-style: italic; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font: 600 .7rem/1.5 var(--f-body); letter-spacing: .08em; text-transform: uppercase; border: 0; }
.pill.do { color: var(--do); background: var(--do-bg); }
.pill.dont { color: var(--dont); background: var(--dont-bg); }
.pill.ideal { color: var(--ideal); background: var(--ideal-bg); }
.pill.vision, .pill.prophecy { color: var(--vision); background: var(--vision-bg); }
.pill.verify { color: var(--warn); background: var(--warn-bg); cursor: pointer; }
.pill svg { width: 12px; height: 12px; }

.rule { text-align: center; display: grid; gap: 8px; padding-bottom: 4px; }
.rule .pa { margin: 0; font-family: var(--f-gur); font-weight: 600; font-size: 1.5rem; line-height: 1.6; text-wrap: balance; }
.rule .en { margin: 0; font-family: var(--f-display); font-size: 1.14rem; line-height: 1.45; color: var(--ink-soft); text-wrap: balance; }
.rule .cap { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.flourish { display: block; width: 120px; height: 12px; margin: 0 auto; color: var(--gold); flex: none; }

.sec { display: grid; gap: 6px; }
.sec p { margin: 0; }
.sec h4 { margin: 0; font: 600 .7rem/1.3 var(--f-body); letter-spacing: .13em; text-transform: uppercase; color: var(--gold); }
.verse { font-family: var(--f-gur); font-size: 1.06rem; line-height: 1.85; padding-left: 12px; border-left: 2px solid var(--gold-soft); }
.missing { font-style: italic; color: var(--ink-soft); font-size: .92rem; }
.cite { font-size: .8rem; color: var(--ink-soft); }
.cite .partial { color: var(--warn); }
.says { font-style: italic; font-size: .95rem; }
.says::before { content: "The text says: "; font-style: normal; color: var(--ink-soft); }
.quote { margin: 4px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--ideal-bg); }
.quote .g { font-family: var(--f-gur); font-size: 1.02rem; line-height: 1.75; color: var(--neela); }
.quote .ang { font-size: .76rem; color: var(--ink-soft); }
.context { border-radius: 10px; padding: 10px 12px; font-size: .9rem; background: var(--ideal-bg); border-left: 3px solid var(--neela); }
.context b { display: block; font: 600 .7rem/1.3 var(--f-body); letter-spacing: .13em; text-transform: uppercase; color: var(--ideal); margin-bottom: 2px; }
.bul { margin: 0; padding-left: 18px; font-size: .9rem; color: var(--ink-soft); display: grid; gap: 4px; }
.sec.todo h4 { color: var(--warn); }
.sec.todo .bul { color: var(--ink); }

/* turning animation */
.sheen { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 3; mix-blend-mode: soft-light;
  background: linear-gradient(105deg, transparent 30%, rgba(255,236,190,.85) 48%, rgba(255,214,140,.5) 52%, transparent 70%);
  background-size: 260% 100%; background-position: calc(50% + var(--d, 2) * 140%) 0;
  opacity: calc(1 - min(1, max(var(--d, 2), calc(var(--d, 2) * -1)) * 1.4)); }
.shade { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; z-index: 3; opacity: 0; }
.card.enter .medal { animation: stamp .7s cubic-bezier(.2,1.4,.4,1) both; }
.card.enter .medal .disc svg { animation: glint .9s .15s ease-out both; }
.card.enter .meta, .card.enter .rule > *, .card.enter .sec, .card.enter .context { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
.card.enter .meta { animation-delay: .1s; }
.card.enter .rule .pa { animation-delay: .18s; }
.card.enter .rule .en { animation-delay: .26s; }
.card.enter .rule .cap { animation-delay: .3s; }
.card.enter .sec, .card.enter .context { animation-delay: .36s; }
@keyframes stamp { 0% { transform: scale(.55) rotate(-40deg); opacity: .3; } 60% { transform: scale(1.08) rotate(6deg); opacity: 1; } 100% { transform: none; } }
@keyframes glint { 0% { transform: scale(.6); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(255,240,200,.9)); } 100% { transform: none; } }
@keyframes rise { from { transform: translateY(14px); opacity: .25; filter: blur(2px); } to { transform: none; opacity: 1; filter: none; } }

/* arrows only where there is a mouse */
.nav-arrow { display: none; }
@media (hover: hover) and (pointer: fine) {
  .nav-arrow { display: grid; place-items: center; position: absolute; top: 50%; z-index: 4; width: 36px; height: 36px; margin-top: -18px;
    border-radius: 50%; border: 1px solid var(--hair); background: var(--leaf); box-shadow: var(--shadow); cursor: pointer; color: var(--ink); opacity: 0; transition: opacity .2s; }
  .nav-arrow svg { width: 16px; height: 16px; }
  .nav-arrow.prev { left: 6px; } .nav-arrow.next { right: 6px; }
  .deck-wrap:hover .nav-arrow:not(:disabled) { opacity: .92; }
}

.swipe-hint { position: absolute; left: 50%; bottom: 26px; z-index: 5; transform: translateX(-50%); pointer-events: none;
  display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  background: var(--bar); color: var(--bar-ink); font-size: .84rem; box-shadow: var(--shadow); transition: opacity .4s; }
.swipe-hint svg { width: 30px; height: 18px; color: #f2a14e; animation: swipe 1.6s ease-in-out infinite; }
.swipe-hint.gone { opacity: 0; }
@keyframes swipe { 0%, 100% { transform: translateX(6px); } 50% { transform: translateX(-6px); } }
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-soft); }
.empty .t { font-family: var(--f-display); font-size: 1.3rem; color: var(--ink); }
.btn { border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600; border: 1px solid var(--kesri); background: none; color: var(--kesri); }
.btn.primary { background: var(--kesri); color: #fff8ea; }
.empty .btn { margin-top: 14px; }

/* ---------- filter sheet ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); opacity: 0; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 86%; display: flex; flex-direction: column;
  background: var(--leaf); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
  transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
.scrim.open { opacity: 1; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--hair); margin: 10px auto 2px; flex: none; }
.sheet-body { overflow-y: auto; padding: 8px 16px 12px; display: grid; gap: 16px; }
.sheet h3 { margin: 0; font: 400 1.3rem var(--f-display); }
.sheet h5 { margin: 0 0 8px; font: 600 .7rem/1.3 var(--f-body); letter-spacing: .13em; text-transform: uppercase; color: var(--gold); }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--gold-soft); }
.seg button { border: 0; border-radius: 9px; padding: 8px 2px; background: transparent; cursor: pointer; font-size: .86rem; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--leaf); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.theme-grid button { display: grid; gap: 1px; text-align: left; border: 1px solid var(--hair); border-radius: 12px; padding: 8px 10px; background: transparent; cursor: pointer; min-width: 0; }
.theme-grid .p { font-family: var(--f-gur-ui); font-weight: 600; font-size: .92rem; line-height: 1.3; }
.theme-grid .e { font-size: .76rem; color: var(--ink-soft); }
.theme-grid button.zero { opacity: .45; }
.theme-grid button[aria-pressed="true"] { border-color: var(--neela); background: var(--ideal-bg); box-shadow: inset 0 0 0 1px var(--neela); }
.sheet-foot { display: flex; gap: 10px; padding: 10px 16px 14px; border-top: 1px solid var(--hair); flex: none; }
.sheet-foot .btn { flex: 1; }

/* ---------- daily ---------- */
.page { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 24px; }
.page-inner { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.cal { background: var(--leaf); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 12px 12px; display: grid; gap: 10px; }
.cal-head { display: flex; align-items: center; gap: 6px; }
.cal-head .t { flex: 1; min-width: 0; padding-left: 4px; }
.cal-head h2 { margin: 0; font: 400 1.25rem/1.2 var(--f-display); }
.cal-head p { margin: 0; font-size: .8rem; color: var(--ink-soft); }
.cal-head .streak { color: var(--kesri); font-weight: 600; }
.cal-nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.cal-nav:disabled { opacity: .3; cursor: default; }
.cal-toggle { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px 0 12px; border-radius: 999px; border: 1px solid var(--hair);
  background: transparent; color: var(--kesri); font-weight: 600; font-size: .84rem; cursor: pointer; flex: none; }
.cal-toggle svg { width: 15px; height: 15px; transition: transform .25s; }
.cal-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.cal.week .cal-nav, .cal.week .cal-key { display: none; }
.cal-grid.swap { animation: rise .35s cubic-bezier(.2,.8,.2,1); }
.cal-nav svg { width: 15px; height: 15px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.dow { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); padding-bottom: 2px; }
.day { position: relative; aspect-ratio: 1; max-width: 42px; width: 100%; justify-self: center; border-radius: 50%; display: grid; place-items: center;
  font-size: .84rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.day.future, .day.pre { color: var(--ink-soft); opacity: .35; }
.day.miss { color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--hair); }
.day.start::before { content: ""; position: absolute; top: -3px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }

/* ---------- card ---------- */
function cardHTML(r) {
  const pending = r.needs_verification.length > 0;
  const refs = r.verse_refs.filter(v => !["PU", "SRK"].includes(v));
  const cite = r.source_text.map(k => texts[k].name.replace(/\s*\(.*\)$/, "")).join(" · ") + (refs.length ? ` · ${refs.join(", ")}` : "");
  return `
  <article class="slot" data-id="${r.id}" aria-roledescription="slide" aria-label="Rule ${r.id}"><div class="card">
    <span class="corner tl">${CORNER}</span><span class="corner tr">${CORNER}</span><span class="corner bl">${CORNER}</span><span class="corner br">${CORNER}</span>
    <div class="leaf-scroll">
      <header class="card-head">
        <div class="medal">${RING}<div class="disc">${svg(RULE_ICON[r.id], 2.6)}</div></div>
        <div class="meta">
          <span class="num">${gNum(r.id)}</span><span class="th">${esc(themes[r.theme].en)}</span>
          <span class="pill ${r.type}">${TYPE_LABEL[r.type]}</span>
          ${pending ? `<button type="button" class="pill verify" data-jump="todo">${WARN}Pending check</button>` : ""}
        </div>
      </header>

      <section class="rule">
        <p class="pa" lang="pa">${esc(r.rule_pa)}</p>
        <p class="en">${esc(r.rule_en)}</p>
        <span class="cap">Simplified wording, not scripture</span>
      </section>

      ${FLOURISH}

      ${CONTEXT_IDS.has(r.id) ? `<div class="context" role="note"><b>Historical context</b>${esc(CONTEXT_TEXT)}</div>` : ""}

      <section class="sec">
        <h4>Source text</h4>
        ${r.original_verse
          ? `<p class="verse" lang="pa">${esc(r.original_verse)}</p>`
          : `<p class="missing">Not yet found online. The original ${r.source_text.includes("SRK") ? "sentence" : "line"} must come from a printed edition.</p>`}
        <p class="cite">${esc(cite)}${r.original_status === "partial" ? ` · <span class="partial">partial line</span>` : ""}</p>
        ${r.text_says ? `<p class="says">${esc(r.text_says)}</p>` : ""}
      </section>

      <section class="sec">
        <h4>Explanation</h4>
        <p>${esc(r.why)}</p>
        ${r.gurbani_ref ? `<div class="quote"><p class="g" lang="pa">${esc(r.gurbani_ref.line)}</p><p class="ang">Guru Granth Sahib, Ang ${r.gurbani_ref.ang}</p></div>` : ""}
      </section>

      ${r.notes.length ? `<section class="sec"><h4>Notes</h4><ul class="bul">${r.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>` : ""}
      ${pending ? `<section class="sec todo" data-todo><h4>To check in a printed edition</h4><ul class="bul">${r.needs_verification.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>` : ""}
    </div>
    <div class="scroll-hint" aria-hidden="true">${DOWN}</div>
    <div class="shade" aria-hidden="true"></div><div class="sheen" aria-hidden="true"></div>
  </div></article>`;
}

const matches = (r, type = state.type, theme = state.theme) => {
  const tf = TYPE_FILTERS.find(f => f.id === type);

  return (theme === "all" || r.theme === theme) && tf.match(r) && (!q || q.split(/\s+/).every(w => r._hay.includes(w)));

function goTo(i, smooth = true) {
  const cards = deck.children; if (!cards.length) return;

        sh.style.opacity = String(k * 0.55);
        sh.style.background = `linear-gradient(${d < 0 ? 270 : 90}deg, rgba(40,20,0,.45), transparent 70%)`;
      } else { c.style.transform = "translateZ(-24px) scale(.97)"; c.style.opacity = ".7"; }
    }
    const bestCard = cards[best].firstElementChild;
    if (!bestCard.classList.contains("is-active")) {
      deck.querySelectorAll(".card.is-active").forEach(c => c.classList.remove("is-active"));
      bestCard.classList.add("is-active");
    }
    if (best !== 0 && !hintDone) dismissHint();
    state.index = best;
    const filtered = state.list.length < rules.length;
    $("#sub").textContent = filtered ? `${best + 1} of ${state.list.length} matching` : `Rule ${best + 1} of ${rules.length}`;
    $("#bar").style.width = ((best + 1) / state.list.length * 100) + "%";
    $("#prev").disabled = best === 0; $("#next").disabled = best === state.list.length - 1;
  });
}
const centreOf = slot => slot.offsetLeft - (deck.clientWidth - slot.clientWidth) / 2;
function landCard() {
  const slot = deck.children[state.index];
  if (!slot) return;
  /* always finish exactly centred, whatever the input (touch, trackpad, wheel, keys) */
  if (Math.abs(deck.scrollLeft - centreOf(slot)) > 1.5) { goTo(state.index); return; }
  const c = slot.firstElementChild;
  if (c === entered || reduceMotion) return;
  entered = c;
  c.classList.remove("enter"); void c.offsetWidth; c.classList.add("enter");
  clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove("enter"), 1400);
}
deck.addEventListener("scroll", () => { onDeckScroll(); clearTimeout(settleT); settleT = setTimeout(landCard, 110); }, { passive: true });
addEventListener("resize", onDeckScroll);
$("#prev").addEventListener("click", () => goTo(state.index - 1));
$("#next").addEventListener("click", () => goTo(state.index + 1));
document.addEventListener("keydown", e => {
  if ($("#view-rules").hidden || e.target.matches("input") || !sheet.hidden) return;
  if (e.key === "ArrowRight") { e.preventDefault(); goTo(state.index + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); goTo(state.index - 1); }
});
let wheelLock = 0;
deck.addEventListener("wheel", e => {
  if (e.target.closest(".leaf-scroll")) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; /* trackpad sideways swipe: native snap handles it */
  e.preventDefault();
  const now = performance.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 4) return;
  wheelLock = now + 450;
  goTo(state.index + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

function openRule(id) {
  showView("rules");
  if (!state.list.some(r => r.id === id)) { state.q = ""; $("#q").value = ""; state.type = state.theme = "all"; applyFilters(); }
  requestAnimationFrame(() => goTo(state.list.findIndex(r => r.id === id), false));
}

/* ---------- daily ---------- */
const dailyRules = rules.filter(r => r.theme === "daily");
const dailyIds = new Set(dailyRules.map(r => r.id));
const keyFor = d => `rahit-daily-${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const todayKey = () => keyFor(new Date());
const doneOn = d => (store.get(keyFor(d)) || []).filter(id => dailyIds.has(id)).length;
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const START_KEY = "rahit-start";
const startDate = () => { const v = store.get(START_KEY); if (!v) return null; const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); };
const markStart = () => { if (!store.get(START_KEY)) { const d = new Date(); store.set(START_KEY, `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`); } };
let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();

function streak() {
  const d = new Date(); let n = 0;
  if (doneOn(d) < dailyIds.size) d.setDate(d.getDate() - 1); /* today still in progress doesn't break it */
  const start = startDate();
  while ((!start || d >= start) && doneOn(d) >= dailyIds.size) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
let calOpen = !!store.get("rahit-cal-open");
function dayCell(date, ctx, stampToday) {
  const { now, today0, start, total } = ctx, isToday = sameDay(date, now);
  const pre = !start || date < start, future = date > today0;
  const n = pre ? 0 : doneOn(date);
  const state = future ? "future" : pre ? "pre" : n >= total ? "full" : n ? "part" : isToday ? "" : "miss";
  const cls = ["day", state, isToday ? "today" : "", start && sameDay(date, start) ? "start" : "", isToday && stampToday ? "stamp" : ""].filter(Boolean).join(" ");
  const label = `${date.toLocaleDateString(undefined, { day: "numeric", month: "long" })}: ${
    { future: "upcoming", pre: "before you started", full: "all rules followed", part: `${n} of ${total}`, miss: "missed", "": "not started yet" }[state]}${start && sameDay(date, start) ? " (first day)" : ""}`;
  return { html: `<div class="${cls}" role="gridcell" aria-label="${label}">${date.getDate()}</div>`, full: state === "full" };
}
function renderCalendar(stampToday = false, animate = false) {
  const now = new Date(), total = dailyIds.size, start = startDate();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const ctx = { now, today0, start, total };
  let full = 0, cells = ["M", "T", "W", "T", "F", "S", "S"].map(w => `<div class="dow" aria-hidden="true">${w}</div>`).join("");
  if (calOpen) {
    const y = calMonth.getFullYear(), mo = calMonth.getMonth();
    const days = new Date(y, mo + 1, 0).getDate(), lead = (new Date(y, mo, 1).getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) cells += `<div></div>`;
    for (let dd = 1; dd <= days; dd++) { const c = dayCell(new Date(y, mo, dd), ctx, stampToday); cells += c.html; full += c.full; }
    $("#calMonth").textContent = calMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    $("#calNext").disabled = y === now.getFullYear() && mo === now.getMonth();
    const first = start || now; /* can't browse to months before tracking began */
    $("#calPrev").disabled = y < first.getFullYear() || (y === first.getFullYear() && mo <= first.getMonth());
  } else {
    const monday = new Date(today0); monday.setDate(today0.getDate() - (today0.getDay() + 6) % 7);
    for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); const c = dayCell(d, ctx, stampToday); cells += c.html; full += c.full; }
    $("#calMonth").textContent = "This week";
  }
  const grid = $("#calGrid"); grid.innerHTML = cells;
  if (animate && !reduceMotion) { grid.classList.remove("swap"); void grid.offsetWidth; grid.classList.add("swap"); }
  $("#cal").classList.toggle("week", !calOpen);
  $("#calToggle").setAttribute("aria-expanded", calOpen);
  $("#calToggleText").textContent = calOpen ? "Week" : "Month";
  $("#calToggle").setAttribute("aria-label", calOpen ? "Show this week only" : "Show the whole month");
  const st = streak();
  $("#calSummary").innerHTML = start
    ? `${full} full day${full === 1 ? "" : "s"} this ${calOpen ? "month" : "week"}${st ? ` · <span class="streak">${st}-day streak</span>` : ""}`
    : "Starts the day you tick your first rule.";
  $("#calKey").innerHTML = start
    ? `<span><i class="k-full"></i>All followed</span><span><i class="k-part"></i>Some</span><span><i class="k-miss"></i>Missed</span>`
    : "";
}
$("#calToggle").addEventListener("click", () => {
  calOpen = !calOpen; store.set("rahit-cal-open", calOpen);
  if (calOpen) { const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
  renderCalendar(false, true);
});
$("#calPrev").addEventListener("click", () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCalendar(); });
$("#calNext").addEventListener("click", () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCalendar(); });

function renderDaily() {
  if (!store.persistent) $("#saveNote").textContent = "This browser isn't saving. Ticks will clear when you close the app.";
  const done = new Set(store.get(todayKey()) || []);
  $("#checklist").innerHTML = dailyRules.map(r => `
    <li class="check ${done.has(r.id) ? "done" : ""}">
      <input type="checkbox" id="d-${r.id}" data-id="${r.id}" ${done.has(r.id) ? "checked" : ""}>
      <label class="box" for="d-${r.id}" aria-label="Mark done">${CHECK}</label>
      <label class="txt" for="d-${r.id}"><div class="pa" lang="pa">${esc(r.rule_pa)}</div><div class="en">${esc(r.rule_en)}</div></label>
      <button class="open" type="button" data-open="${r.id}" aria-label="Read rule ${r.id} in full">${CHEV}</button>
    </li>`).join("");
  updateToday(done.size);
  renderCalendar();
}
function updateToday(n) {
  const total = dailyIds.size;
  $("#todayText").textContent = "Today, " + new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
  $("#todayCount").textContent = n >= total ? "All done" : `${n} of ${total}`;
  $("#todayMeter").style.width = (n / total * 100) + "%";
}
let toastT;
function toast(html) {
  const t = $("#toast"); t.innerHTML = html; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800);
}
$("#checklist").addEventListener("change", e => {
  const total = dailyIds.size, before = doneOn(new Date());
  const ids = [...document.querySelectorAll("#checklist input:checked")].map(i => +i.dataset.id);
  if (ids.length) markStart();
  store.set(todayKey(), ids);
  e.target.closest(".check").classList.toggle("done", e.target.checked);
  updateToday(ids.length);
  const completed = ids.length >= total && before < total;
  if (completed) { const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
  renderCalendar(completed);
  if (completed) {
    toast(`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="10" width="34" height="31" rx="4"/><path d="M7 19h34M16 6v8M32 6v8"/><path d="M17 30l5 5 9-9"/></svg><span><span class="p">ਨਿਤਨੇਮ ਪੂਰਾ</span> · Today is marked on your calendar</span>`);
    $(".cal").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }
});
$("#checklist").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openRule(+b.dataset.open); });
$("#clearDay").addEventListener("click", () => { store.set(todayKey(), []); renderDaily(); });

/* ---------- sources ---------- */

  $("#aboutInner").innerHTML = `
    <div class="section">

        <dt>Gurmukhi and English at the top</dt><dd>${esc(fg.rule_pa)}</dd>

/* ---------- tabs ---------- */
function showView(v) {
  document.querySelectorAll(".view").forEach(el => el.hidden = el.id !== "view-" + v);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  if (v === "daily") renderDaily();
  if (v === "rules") onDeckScroll();
}
document.querySelector(".tabbar").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) showView(t.dataset.view); });

/* ---------- gold dust ---------- */
(function dust() {
  const cv = $("#dust"), ctx = cv.getContext("2d");
  let W, H, motes = [];
  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    motes = Array.from({ length: Math.round(W * H / 22000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .4, vy: -(Math.random() * .18 + .04), vx: (Math.random() - .5) * .12, p: Math.random() * 6.28 }));
  };
  const col = () => getComputedStyle(document.documentElement).getPropertyValue("--gold").trim() || "#9c7322";
  let c = col();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => c = col());
  const draw = t => {
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = c;
    for (const m of motes) {
      if (!reduceMotion) { m.x += m.vx; m.y += m.vy; if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; } }
      ctx.globalAlpha = .25 + .2 * Math.sin(t / 900 + m.p);
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  };
  size(); addEventListener("resize", size); requestAnimationFrame(draw);
})();

document.querySelectorAll(".app, .screen").forEach(el => el.addEventListener("scroll", () => { el.scrollTop = 0; el.scrollLeft = 0; }));

applyFilters();
renderAbout();
showHint();
const m = /^#rule-(\d+)$/.exec(location.hash);
if (m) openRule(+m[1]);
else if (location.hash === "#daily") showView("daily");
else if (location.hash === "#sources") showView("about");
</script>
